name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Netlify Production
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://agricooop.netlify.app/

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile Java JDBC Backend
        run: |
          mvn -f server-java/pom.xml clean compile -q
          echo "Java backend compiled successfully."

      - name: Validate Client Frontend
        run: |
          test -f client/index.html || (echo "Missing client/index.html" && exit 1)
          test -f client/js/index.js  || (echo "Missing client/js/index.js"  && exit 1)
          test -f client/js/market.js || (echo "Missing client/js/market.js" && exit 1)
          echo "Frontend files validated."

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './client'
          production-branch: main
          production-deploy: true
          deploy-message: "Production deploy from GitHub Actions — ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Confirm Deployment
        run: |
          echo "========================================================"
          echo " AgriCoop deployed to production!"
          echo " Live at: https://agricooop.netlify.app/"
          echo "========================================================"
